<main class="container my-5" style="max-width: 1200px;">
    <h1 class="h3 fw-bold mb-4 text-dark ms-2">Cart</h1>

    <!-- INTEGRATION: Full-Width Horizontal Bootstrap Alert Notification -->
    @if (message()) {
    <div class="alert alert-dismissible fade show border shadow-sm mb-4 w-100" [class.alert-success]="isSuccess()"
        [class.border-success]="isSuccess()" [class.alert-danger]="!isSuccess()" [class.border-danger]="!isSuccess()"
        role="alert" style="border-radius: 6px; font-size: 14px; padding: 12px 20px;">
        <div class="d-flex align-items-center fw-medium">
            @if (isSuccess()) {
            <strong class="me-2">Success!</strong>
            } @else {
            <strong class="me-2">Error:</strong>
            }
            {{ message() }}
        </div>
        <button type="button" class="btn-close" (click)="clearAlert()" aria-label="Close"
            style="shadow: none;"></button>
    </div>
    }

    <!-- Wrapper layout structure forces horizontal side-by-side alignment -->
    <div class="cart-flex-layout-grid">

        <!-- Left Side Panel (Spans 66.6% of horizontal area) -->
        <div class="cart-left-panel">
            <div class="cart-wrapper-card shadow-sm" id="cartItemsContainer">

                <!-- Table Header Layout Grid (Hidden on Mobile viewports) -->
                <div class="cart-header-row d-none d-md-flex row m-0 text-center">
                    <div class="col-md-7 text-start ps-5">Product</div>
                    <div class="col-md-2">Price</div>
                    <div class="col-md-1">Quantity</div>
                    <div class="col-md-2 text-end pe-4">Subtotal</div>
                </div>

                <app-cart-items [cartItems]="cart()?.items!" (cartItemRemoved)="removeCartItem($event)"
                    (cartItemAdded)="addItemtoCart($event)"
                    (cartItemQuantityDecreased)="decreaseCartItemQuantity($event)"></app-cart-items>
            </div>
        </div>

        <!-- Right Side Panel (Spans 33.3% of horizontal area) -->
        <app-cart-total [cartId]="cart()?.cartId ?? ''" class="cart-right-panel" [total]="total()"></app-cart-total>

    </div>
</main>
