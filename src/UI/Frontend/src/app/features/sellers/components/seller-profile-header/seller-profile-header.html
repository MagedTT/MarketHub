<div class="store-profile-header-card shadow-sm mb-4">
    <div class="row align-items-center g-4">

        <!-- Left Spot: Logo Placement (LogoUrl) -->
        <div class="col-auto d-flex justify-content-center">
            <div class="store-logo-frame position-relative">
                <img [src]="logoUrlValue" alt="Store Logo Preview" class="store-logo-img">

                <!-- FIXED: Placed outside @if block so cursor: pointer class registers natively on hover. -->
                <!-- Uses [class.d-none] to safely hide the interactive overlay layer during public views. -->
                <label for="logoFileInput" class="avatar-edit-overlay d-flex align-items-center justify-content-center"
                    [class.d-none]="!isEditing">
                    <i class="bi bi-camera text-white fs-5"></i>
                </label>
                <input type="file" id="logoFileInput" accept="image/*" class="d-none" (change)="onLogoChanged($event)">
            </div>
        </div>

        <!-- Center Spot: Name and Description Text Blocks -->
        <div class="col text-center text-md-start">
            <div class="mb-2">
                <span class="badge-custom-tint bg-success-tint">
                    <i class="bi bi-circle-fill fs-6-px"></i> Verified Store Active
                </span>
            </div>
            <h1 class="h3 fw-bold mb-2">MarketHub Shop Platform</h1>

            @if (!isEditing) {
            <p class="mb-0 opacity-75 text-wrap max-width-600 fs-14-5 text-silver">{{ currentDescription() }}</p>
            } @else {
            <textarea class="form-control form-control-dark bg-transparent text-white border-secondary opacity-90 p-2"
                rows="2" [(ngModel)]="editableDescription" placeholder="Update shop summary narrative..."></textarea>
            }
        </div>

        <!-- Right Spot: Master Form State Control Toolbar Elements -->
        <div class="col-xl-4 col-md-5 col-12 text-center text-md-end">
            @if (!isEditing) {
            <!-- FIXED: Re-routed method hook tracker to point to your editToggled debugging script function -->
            <button class="btn btn-primary d-inline-flex align-items-center gap-2 px-4 py-2" (click)="editToggled(true)"
                type="button">
                <i class="bi bi-pencil-square"></i>
                <span>Edit Profile</span>
            </button>
            } @else {
            <div class="d-flex justify-content-center justify-content-md-end gap-2">
                <!-- FIXED: Re-routed Cancel button tracker to point to your editToggled debugging script function -->
                <button class="btn btn-light px-3 py-2 fw-semibold" (click)="editToggled(false)">Cancel</button>
                <button class="btn btn-success px-4 py-2 fw-semibold" (click)="saveProfile.emit()">
                    <i class="bi bi-check-circle me-1"></i> Save
                </button>
            </div>
            }
        </div>

    </div>
</div>
