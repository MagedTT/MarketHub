<div class="sidebar-wrapper-inner">

    <!-- Conditionally injects advanced product filtrations when user session is active -->
    @if (session.isAuthenticated()) {
    <div class="filter-section-wrapper mb-4 p-3 rounded bg-light border border-opacity-10">
        <h5 class="fw-bold text-dark mb-3 pb-2 border-bottom small text-uppercase tracking-wider">Filter Products</h5>

        <!-- Price Range Metrics Container -->
        <div class="filter-group mb-3">
            <label class="form-label text-secondary small fw-semibold text-uppercase">Price Range</label>
            <div class="d-flex align-items-center gap-2">
                <input type="number" class="form-control form-control-sm text-center bg-white shadow-none"
                    placeholder="Min" [(ngModel)]="filters().priceFrom">
                <span class="text-muted small">to</span>
                <input type="number" class="form-control form-control-sm text-center bg-white shadow-none"
                    placeholder="Max" [(ngModel)]="filters().priceTo">
            </div>
        </div>

        <!-- Rating Range Metrics Container -->
        <div class="filter-group mb-4">
            <label class="form-label text-secondary small fw-semibold text-uppercase">Rating Range (★)</label>
            <div class="d-flex align-items-center gap-2">
                <select class="form-select form-select-sm bg-white shadow-none" [(ngModel)]="filters().ratingFrom">
                    <option [value]="0">From</option>
                    <option [value]="1">1 ★</option>
                    <option [value]="2">2 ★</option>
                    <option [value]="3">3 ★</option>
                    <option [value]="4">4 ★</option>
                </select>
                <span class="text-muted small">to</span>
                <select class="form-select form-select-sm bg-white shadow-none" [(ngModel)]="filters().ratingTo">
                    <option [value]="5">To</option>
                    <option [value]="1">1 ★</option>
                    <option [value]="2">2 ★</option>
                    <option [value]="3">3 ★</option>
                    <option [value]="4">4 ★</option>
                    <option [value]="5">5 ★</option>
                </select>
            </div>
        </div>

        <!-- Category Checkboxes Cluster -->
        <div class="filter-group mb-3">
            <label class="form-label text-secondary small fw-semibold text-uppercase d-block mb-2">Categories</label>

            <div class="form-check mb-1">
                <input class="form-check-input shadow-none" type="checkbox" id="cat-electronics"
                    [(ngModel)]="filters().categories.electronics">
                <label class="form-check-label text-dark small" for="cat-electronics">Electronics</label>
            </div>

            <div class="form-check mb-1">
                <input class="form-check-input shadow-none" type="checkbox" id="cat-tvs"
                    [(ngModel)]="filters().categories.tvs">
                <label class="form-check-label text-dark small" for="cat-tvs">TVs</label>
            </div>
            <div class="form-check mb-1">
                <input class="form-check-input shadow-none" type="checkbox" id="cat-phones"
                    [(ngModel)]="filters().categories.phones">
                <label class="form-check-label text-dark small" for="cat-phones">Phones</label>
            </div>
        </div>

        <button class="btn btn-link btn-sm text-primary p-0 text-decoration-none fw-medium small" type="button"
            (click)="applyFilters()">
            Search
        </button>

        <br />

        <button class="btn btn-link btn-sm text-primary p-0 text-decoration-none fw-medium small" type="button"
            (click)="resetFilters()">
            Reset Filters
        </button>
    </div>

    <div class="sidebar-divider mb-4"></div>
    <!-- Main Navigation Link Options List -->
    <nav class="nav flex-column sidebar-nav-custom" role="navigation">
        <!-- My Orders (Active Route Example) -->
        <a class="nav-link" style="cursor: pointer;" routerLink="/account/orders" routerLinkActive="active" role="tab">
            <svg viewBox="0 0 24 24">
                <path
                    d="M21 8H3V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2zm0 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V10h18zm-7 3h-4v2h4v-2z" />
            </svg>
            Orders
        </a>

        <!-- Your Addresses -->
        <a class="nav-link" style="cursor: pointer;" routerLink="/account/addresses" routerLinkActive="active"
            role="tab">

            </svg>
            Addresses
        </a>
