<header class="bg-white border-bottom py-3">
    <div class="container-fluid px-4">

        <!-- Row 1: Top Navigation Grid -->
        <div class="row align-items-center g-3">

            <!-- Brand logo left -->
            <div class="col-xl-2 col-md-3 col-6">
                <a routerLink="/" class="brand-logo-container">
                    <div class="brand-logo-img">
                        <svg xmlns="http://w3.org" width="20" height="20" fill="#ffffff" viewBox="0 0 16 16">
                            <path
                                d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1zm3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4h-3.5z" />
                        </svg>
                    </div>
                    <span class="brand-logo-text">Brand<span>name</span></span>
                </a>
            </div>

            <!-- Centralized Search Engine Component -->
            <div class="col-xl-7 col-md-6 col-12 order-3 order-md-2">
                <div class="input-group search-container-box" style="height: 42px;">
                    <input type="text" class="form-control" placeholder="Find product" aria-label="Find product">

                    <!-- Bootstrap 5 Native Dropdown -->
                    <button class="btn-category-select dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        All category
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" routerLink="/category/electronics">Electronics</a></li>
                        <li><a class="dropdown-item" routerLink="/category/apparel">Apparel</a></li>
                        <li><a class="dropdown-item" routerLink="/category/home-decor">Home Decor</a></li>
                    </ul>

                    <button class="btn-search-submit" type="button">Search</button>
                </div>
            </div>

            <!-- Right Micro Utilities Layout -->
            <div class="col-xl-3 col-md-3 col-6 order-2 order-md-3 d-flex justify-content-end gap-3">
                <!-- Orders -->
                <a routerLink="/account/orders" routerLinkActive="active-link" class="utility-item-link">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M21 8H3V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2zm0 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V10h18zm-7 3h-4v2h4v-2z" />
                    </svg>
                    <span class="utility-label-text">Orders</span>
                </a>

                <!-- Saved -->
                <a (click)="navigateToWishlist()" routerLinkActive="active-link" class="utility-item-link">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                    </svg>
                    <span class="utility-label-text">Saved</span>
                </a>

                <!-- My Cart -->
                <a routerLink="/cart" routerLinkActive="active-link" class="utility-item-link">
                    <!-- FIX: Relative wrapper isolates floating coordinates -->
                    <div class="icon-badge-wrapper">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" />
                        </svg>
                        <!-- FIX: Floating Badge overlay -->
                        @if (cartStore.cartAmount() > 0) {
                        <span class="cart-badge-floating badge rounded-pill bg-danger">
                            {{ cartStore.cartAmount() }}
                        </span>
                        }
                    </div>
                    <span class="utility-label-text">My cart</span>
                </a>

                <!-- Sign In -->
                <a (click)="navigateToSignIn()" routerLinkActive="active-link" class="utility-item-link">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-3-8-3z" />
                    </svg>
                    <span class="utility-label-text">Sign in</span>
                </a>
            </div>
        </div>

        <!-- Row 2: Secondary Category Horizontal Bar Section -->
        <nav class="sub-nav-bar mt-3 pt-2 border-top flex-wrap">
            <a routerLink="/products" class="sub-nav-item">
                <!-- Menu hamburger icon -->
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                All category
            </a>
            <a routerLink="/offers" class="sub-nav-item">Hot offers</a>
            <a routerLink="/services" class="sub-nav-item">Services</a>
            <a routerLink="/bestsellers" class="sub-nav-item">Bestsellers</a>
            <a routerLink="/gift-boxes" class="sub-nav-item">Gift boxes</a>
            <a routerLink="/help" class="sub-nav-item">
                Help
                <!-- Down arrow icon -->
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                    style="width:12px; height:12px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
            </a>
        </nav>

    </div>
</header>
